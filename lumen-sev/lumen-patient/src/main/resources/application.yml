# lumen-patient local configuration (随访 fu-launch shape - user decision 2026-11-03,
# design D8: no Nacos anywhere; local files only).
#   - THIS FILE is committed and carries NO credentials - framework-demanded feature
#     values plus safe local defaults only.
#   - Credentials / environment endpoints live in the GITIGNORED application-dev.yml
#     (template: application-dev.yml.example, same pattern as fu_sev).
# Service identity per specs/service-topology "Service Identity" (patient-domain D6):
# spring.application.name = module name, port 8082, nginx /api/v1/patient/**.
server:
  port: 8082

spring:
  application:
    name: lumen-patient
  profiles:
    active: dev                 # the dev profile (gitignored file) carries datasource/redis
  flyway:
    # Migration ledger + unqualified DDL are pinned to THIS service's own schema
    # (user ruling 2026-11-03: flyway_schema_history stays in the service schema,
    # never public). Explicit values make a misconfigured connection URL
    # (e.g. currentSchema=public) fail loudly instead of silently migrating public.
    schemas: patient
    default-schema: patient
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher   # springfox 3.0 requirement on Boot 2.5
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss    # data spec: audit timestamps serialize GMT+8

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT login state - demanded by framework/security/TokenService (@Value token.*).
token:
  header: Authorization         # clients send "Authorization: Bearer <jwt>"
  # HS512-grade signing secret (>=64 chars) - PLACEHOLDER, production MUST replace it
  # (env var or gitignored profile; never commit a real secret).
  secret: lumen-collab-jwt-secret-change-me-in-production-0123456789abcdef
  expireTime: 1440              # minutes; TokenService slides the Redis expiry

# OpenAPI metadata (framework SwaggerConfig @Value; OPS literals are the defaults)
swagger:
  title: LumenCollab
  description: LumenCollab patient service API
  version: 1.0.0

# XSS filter - demanded by framework/config/FilterConfig (@Value xss.*).
xss:
  enabled: true
  excludes: /css/*,/js/*,/images/*
  urlPatterns: /*

# Unified envelope advice exclusions - framework GlobalProperties (prefix "dispose").
dispose:
  adviceFilterPackage:
    - springfox.documentation
    - org.springframework

# Service-declared anonymous paths (framework AnonymousPathCustomizer, lumen
# adaptation (6)): the INTERNAL service surface (us-station-registration-sev design
# D4) is exempt from user-token auth - there is no user behind a service call - and
# guarded by the patient-side X-Internal-Key interceptor (patient
# config/InternalKeyInterceptor, fail-closed: an unconfigured key rejects every call)
# instead of user perms. ONLY the /internal/** family is anonymous: every user-facing
# path stays token-guarded by the copied chain (the "203" envelope when tokenless).
security:
  permit-all:
    - /api/v1/patient/internal/**

# Deliberately ABSENT blocks (patient-domain task 1.1; amended by
# us-station-registration-sev task 2.2):
#   - security.permit-all was ABSENT while patient had NO machine surface - every path
#     stayed token-guarded; the internal service surface now owns the ONE permit-all
#     entry above (internal-key guarded, never user perms). Patient still has NO login
#     of its own - the lumen-system-owned anonymous paths (login/auth-key) belong to
#     the JWT issuer.
#   - upload.*: framework WebMvcConfig keeps the location-less /profile/** parity
#     registration when upload.home is absent (adaptation #7 default) - patient has
#     no upload surface.
#   - lumen.security.password-crypto: PasswordCipherHelper and its consumers are
#     lumen-system manage classes only - patient has no SM2 usage.

logging:
  level:
    org.birdbro: debug
  file:
    name: ./logs/lumen-patient.log

# Platform number-rule service (number-rule-unification-sev task 3.1, design D5/D6):
# the patient service issues pat_id through the NumberApi Feign contract against the
# SYSTEM service - direct URL (no discovery, the 2026-11-03 local-config ruling;
# env var wins, the local default targets the locally-running lumen-system). The
# internal key rides the SAME value the system side checks - gitignored overrides in
# application-dev.yml / env vars, never a committed real key (fail-closed both sides).
feign:
  sentinel:
    enabled: true   # the NumberApi fail-fast fallback resolves through Sentinel

lumen:
  api:
    system:
      url: ${LUMEN_API_SYSTEM_URL:http://localhost:8081}
  internal-api-key: ${LUMEN_INTERNAL_API_KEY:}
