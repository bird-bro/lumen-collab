# Test profile (init-backend-skeleton task 3.2; test-server semantics reworked by
# auth-rbac-foundation tasks 1.2-1.3, design D3). The context loads with NO Nacos: no
# discovery registration, no remote config import (flags below plus the bootstrap.yml
# test-profile document - keep both).
#
# Test-server semantics (design D3): lumen-auth's data-layer tests connect to the TEAM
# TEST SERVER (PostgreSQL + Redis, externally provisioned - no Testcontainers, no local
# daemon). AuthIntegrationTestBase injects the REAL datasource, Redis, and Flyway
# properties via @DynamicPropertySource at context creation, resolved from the gitignored
# lumen-sev/.env-test.local (AUTH_TEST_* variables; the base class walks up from the
# module dir to find it). Deliberately NO datasource properties here anymore: a static
# entry would mask an unconfigured server, while missing AUTH_TEST_* variables now fail
# the context explicitly in AuthTestEnv.require (never a silent skip).
spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    discovery:
      enabled: false

---

# Framework placeholder dummies (skeleton Batch 4 GREEN step, kept unchanged): the
# copied framework beans demand these via @Value. OPS supplies them from Nacos remote
# config, which does not exist here - the skeleton's red run named them (first:
# xss.excludes in framework/config/FilterConfig; then TokenService's token.* fields).
# Values below are explicit dummies for tests only (not real credentials -
# execution-contract behavior 16 is about real secrets; none of these is one):
# - token.header / token.secret / token.expireTime -> framework/security/TokenService.java
#   (@Component, always created; real values come from Nacos/env in the auth feature change)
# - xss.excludes / xss.urlPatterns -> framework/config/FilterConfig.java
#   (@Configuration, always created; its xss filter @Bean stays off - xss.enabled unset)
token:
  header: test-header
  secret: test-only-dummy-not-a-secret
  expireTime: 3600
xss:
  excludes: /css/*,/js/*,/images/*
  urlPatterns: /*
