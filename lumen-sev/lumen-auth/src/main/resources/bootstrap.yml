# Nacos wiring in the OPS birdbro-launch bootstrap.yaml style (design D3):
# config + discovery blocks with file-extension yaml, then the application name.
# Neutralized for lumen per specs/service-topology "Sensitive Configuration Exclusion":
# - server address and namespace are environment placeholders (no literal endpoints,
#   no committed credentials, no secret of any kind in this file).
# - An empty NACOS_NAMESPACE resolves to the Nacos default (public) namespace,
#   matching an unset namespace property.
# The test profile (src/test/resources/application-test.yml) flips both Nacos
# features off so a context loads with no infrastructure (design D3).
spring:
  application:
    name: lumen-auth
  cloud:
    nacos:
      config:
        file-extension: yaml
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}

---

# Test-profile NEUTRALIZATION (B3 review Critical-1, design D3): the flags must
# live HERE, inside bootstrap.yml, because with spring-cloud-starter-bootstrap
# present the bootstrap context binds NacosConfigProperties from bootstrap.yml
# ONLY - application-test.yml loads into the main environment after the bootstrap
# phase, too late to stop the config import (measured: ServerHttpAgent connection
# attempts to :8848 during context load). The bootstrap context inherits the run's
# active profiles (spring-cloud-context 3.0.3), so this document activates for
# every test-profile run and the bootstrap phase skips Nacos entirely.
# application-test.yml keeps the same flags: harmless duplication, and it stays
# the home for future test-only properties.
spring:
  config:
    activate:
      on-profile: test
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
    discovery:
      enabled: false

