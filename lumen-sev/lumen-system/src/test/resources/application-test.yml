# Test profile (init-backend-skeleton task 3.2; test-server semantics reworked by
# auth-rbac-foundation tasks 1.2-1.3, design D3).
#
# Local-config era (user decision 2026-11-03, design D8): there is NO Nacos anywhere in
# the stack, so this file carries no nacos-off flags and no framework placeholder
# dummies anymore - the committed application.yml supplies token.*/xss.*/dispose.*
# directly (the old dummies existed only because the values were expected from a
# remote config center that does not exist).
#
# Test-server semantics (design D3): lumen-system's data-layer tests connect to the TEAM
# TEST SERVER (PostgreSQL + Redis, externally provisioned - no Testcontainers, no local
# daemon). AuthIntegrationTestBase injects the REAL datasource, Redis, and Flyway
# properties via @DynamicPropertySource at context creation, resolved from the gitignored
# lumen-sev/.env-test.local (AUTH_TEST_* variables; the base class walks up from the
# module dir to find it). Deliberately NO datasource properties here: a static entry
# would mask an unconfigured server, while missing AUTH_TEST_* variables fail the
# context explicitly in AuthTestEnv.require (never a silent skip).
#
# The spring.profiles.active=dev default of application.yml is overridden by
# @ActiveProfiles("test"), so the gitignored application-dev.yml is NOT loaded in
# tests - the dynamic properties remain the only datasource source of truth.
