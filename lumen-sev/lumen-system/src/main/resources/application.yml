# lumen-system local configuration (随访 fu-launch shape - user decision 2026-11-03,
# design D8: no Nacos anywhere; local files only).
#   - THIS FILE is committed and carries NO credentials - framework-demanded feature
#     values plus safe local defaults only.
#   - Credentials / environment endpoints live in the GITIGNORED application-dev.yml
#     (template: application-dev.yml.example, same pattern as fu_sev).
# Service identity per specs/service-topology "Service Identity":
# spring.application.name = module name, port 8081.
server:
  port: 8081

spring:
  application:
    name: lumen-system
  profiles:
    active: dev                 # the dev profile (gitignored file) carries datasource/redis
  flyway:
    # Migration ledger + unqualified DDL are pinned to THIS service's own schema
    # (user ruling 2026-11-03: flyway_schema_history stays in the service schema,
    # never public). Explicit values make a misconfigured connection URL
    # (e.g. currentSchema=public) fail loudly instead of silently migrating public.
    schemas: system
    default-schema: system
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher   # springfox 3.0 requirement on Boot 2.5
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss    # data spec: audit timestamps serialize GMT+8
  servlet:
    multipart:
      # Transport ceiling only - headroom above the 2MB BUSINESS cap enforced in
      # CommonController (org-logo-upload-api D4). Exceeding the business cap still
      # answers A0400 from the controller, never Boot's MaxUploadSizeExceededException 500.
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT login state - demanded by framework/security/TokenService (@Value token.*).
token:
  header: Authorization         # clients send "Authorization: Bearer <jwt>"
  # HS512-grade signing secret (>=64 chars) - PLACEHOLDER, production MUST replace it
  # (env var or gitignored profile; never commit a real secret).
  secret: lumen-collab-jwt-secret-change-me-in-production-0123456789abcdef
  expireTime: 1440              # minutes; TokenService slides the Redis expiry

# OpenAPI metadata (framework SwaggerConfig @Value; OPS literals are the defaults)
swagger:
  title: LumenCollab
  description: LumenCollab system service API
  version: 1.0.0

# Service-declared anonymous paths (framework AnonymousPathCustomizer, lumen adaptation (6)):
# the JWT issuer owns the login endpoint - the ONLY path needing no authentication.
# Every other path (including /system/me) stays token-guarded by the copied chain
# (rejected with the "203" envelope when tokenless).
security:
  permit-all:
    - /api/v1/system/login
    # The SM2 public-key distribution for password transport encryption (coordinate D3):
    # the login page must fetch the key BEFORE it can produce a login body, so the key
    # endpoint is anonymous like /login itself.
    - /api/v1/system/auth-key

# Password transport encryption (password-transport-encryption-api, coordination D2):
# SM2 keypair, STATIC per deployment. key-id identifies the active key (rotation hook);
# sm2-private-key is the 32-byte raw scalar D as 64-char hex - SENSITIVE CONFIG (design
# D8): the committed empty default FAILS STARTUP by design (PasswordCipherHelper
# fail-fast); real values ship via env var / the gitignored application-dev.yml, NEVER
# committed. Generate a keypair: sm2.generateKeyPairHex() (sm-crypto) or Hutool
# SmUtil.sm2() - public key is derived from D, never configured.
lumen:
  security:
    password-crypto:
      key-id: sm2-v1
      sm2-private-key:

# XSS filter - demanded by framework/config/FilterConfig (@Value xss.*).
xss:
  enabled: true
  excludes: /css/*,/js/*,/images/*
  urlPatterns: /*

# Unified envelope advice exclusions - framework GlobalProperties (prefix "dispose").
dispose:
  adviceFilterPackage:
    - springfox.documentation
    - org.springframework

# Local image upload (org-logo-upload-api, OPS CommonController vocabulary 1:1) -
# framework WebMvcConfig reads upload.home (adaptation #7: it completes the truncated
# OPS /profile/** registration with these file: locations; a service WITHOUT this key
# keeps the location-less parity registration). Safe defaults only - no credentials;
# override per environment via the gitignored application-dev.yml. upload.avatar is the
# URL-path prefix persisted as the stored value (served anonymously via GET /profile/**).
#
# USER DECISION 2026-11-06: prefer an ABSOLUTE upload.home in the dev override.
# A relative value anchors at the launcher's CWD, and IDEA / mvn / shell launches
# disagree - a write/read anchor mismatch breaks the /profile read-back with a silent
# 404 (the write lands where FileUtils resolves it, the handler reads where IT
# resolves it). ./upload stays here only as the portable fresh-clone default.
upload:
  home: ./upload
  avatar: /profile/avatar

logging:
  level:
    org.birdbro: debug
  file:
    name: ./logs/lumen-system.log
