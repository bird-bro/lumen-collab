# lumen-setting local configuration (随访 fu-launch shape - user decision 2026-11-03,
# design D8: no Nacos anywhere; local files only).
#   - THIS FILE is committed and carries NO credentials - framework-demanded feature
#     values plus safe local defaults only.
#   - Credentials / environment endpoints live in the GITIGNORED application-dev.yml
#     (template: application-dev.yml.example, same pattern as lumen-system).
# Service identity per specs/service-topology "Service Identity":
# spring.application.name = module name, port 8082 (system took 8081).
server:
  port: 8082

spring:
  application:
    name: lumen-setting
  profiles:
    active: dev                 # the dev profile (gitignored file) carries datasource/redis
  flyway:
    # Migration ledger + unqualified DDL are pinned to THIS service's own schema
    # (user ruling 2026-11-03: flyway_schema_history stays in the service schema,
    # never public). Explicit values make a misconfigured connection URL
    # (e.g. currentSchema=public) fail loudly instead of silently migrating public.
    schemas: setting
    default-schema: setting
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher   # springfox 3.0 requirement on Boot 2.5
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss    # data spec: audit timestamps serialize GMT+8

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT login state - demanded by framework/security/TokenService (@Value token.*).
# This service does NOT issue tokens (the issuer is lumen-system); it only verifies
# them through the copied chain, so the secret must MATCH lumen-system's per deployment.
token:
  header: Authorization         # clients send "Authorization: Bearer <jwt>"
  # HS512-grade signing secret (>=64 chars) - PLACEHOLDER, production MUST replace it
  # (env var or gitignored profile; never commit a real secret).
  secret: lumen-collab-jwt-secret-change-me-in-production-0123456789abcdef
  expireTime: 1440              # minutes; TokenService slides the Redis expiry

# OpenAPI metadata (framework SwaggerConfig @Value; OPS literals are the defaults)
swagger:
  title: LumenCollab
  description: LumenCollab exam-setting service API
  version: 1.0.0

# No security.permit-all block: this service owns NO anonymous path - every
# /api/v1/setting/** endpoint requires a token (SecurityAnonymousProperties defaults
# to an empty list; the JWT issuer's login/auth-key stay lumen-system's).

# XSS filter - demanded by framework/config/FilterConfig (@Value xss.*).
xss:
  enabled: true
  excludes: /css/*,/js/*,/images/*
  urlPatterns: /*

# Unified envelope advice exclusions - framework GlobalProperties (prefix "dispose").
dispose:
  adviceFilterPackage:
    - springfox.documentation
    - org.springframework

logging:
  level:
    org.birdbro: debug
  file:
    name: ./logs/lumen-setting.log
