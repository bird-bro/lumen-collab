# LumenCollab hospital-form infrastructure (init-infra-compose).
# Containers: PostgreSQL (six per-service DBs) + Nacos (config center ONLY, standalone)
# + Redis. The unified entry is nginx - deployed by the deferred docker change; there is
# NO Java gateway container. lumen application containers join when they become runnable
# jars (spring-boot repackage is deliberately absent in the skeleton).
# All ports/credentials overridable via .env (copy .env.example -> .env; .env is gitignored).
name: lumen-infra

services:
  postgres:
    image: postgres:16-alpine
    container_name: lumen-postgres
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lumen_auth}
      TZ: Asia/Shanghai
    ports:
      - "${PG_PORT:-15432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v1.4.2
    container_name: lumen-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      TZ: Asia/Shanghai
    ports:
      - "${NACOS_PORT:-8848}:8848"
    volumes:
      - nacos-derby:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/v1/console/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on: {}

  redis:
    image: redis:7-alpine
    container_name: lumen-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  pg-data:
  nacos-derby:
  redis-data:
